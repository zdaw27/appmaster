<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRIDE 운동 기록 · 제작 샘플</title><link rel="stylesheet" href="../samples.css?v=2"><link rel="stylesheet" href="../static-view.css"></head><body data-app="fitness" class="static-sample"><div class="demo-strip">화면 예시 · 스크롤하여 페이지를 살펴보세요.</div><main id="app"><section class="fitness-app"><header><b>STRIDE<span>TRAINING</span></b><nav><span class="selected">대시보드</span><span>운동 루틴</span><span>활동 기록</span></nav><span class="fitness-user">JW</span></header><div class="fitness-content"><div class="fitness-title"><div><small>WEDNESDAY, OCT 21</small><h1>오늘도 한 걸음 더, 지우님.</h1></div><span>이번 주 3일째 운동 중 <i>●</i></span></div><div class="fitness-layout"><div class="fitness-left"><div class="workout-hero"><img src="../assets/workout.jpg" alt="체육관에서 운동하는 사람"><div><small>TODAY’S WORKOUT</small><h2>전신 근력<br>30분 루틴</h2><p>중급 · 덤벨 · 6개 동작</p><button id="start-workout" disabled="" tabindex="-1" aria-disabled="true" style="color: rgb(23, 23, 25);">운동 시작하기 ▶</button></div></div><div class="exercise-panel"><div><h3>오늘의 운동</h3><span>총 4개 동작</span></div><label class="exercise-row"><span class="exercise-index">01</span><b>스쿼트<small>하체</small></b><span>12회 × 3세트</span><input type="checkbox" class="exercise-check" aria-label="스쿼트 완료" disabled="" tabindex="-1" aria-disabled="true" value="on" style="color: rgb(40, 48, 66);"></label><label class="exercise-row"><span class="exercise-index">02</span><b>덤벨 로우<small>등</small></b><span>10회 × 3세트</span><input type="checkbox" class="exercise-check" aria-label="덤벨 로우 완료" disabled="" tabindex="-1" aria-disabled="true" value="on" style="color: rgb(40, 48, 66);"></label><label class="exercise-row"><span class="exercise-index">03</span><b>푸시업<small>가슴</small></b><span>12회 × 3세트</span><input type="checkbox" class="exercise-check" aria-label="푸시업 완료" disabled="" tabindex="-1" aria-disabled="true" value="on" style="color: rgb(40, 48, 66);"></label><label class="exercise-row"><span class="exercise-index">04</span><b>런지<small>하체</small></b><span>10회 × 3세트</span><input type="checkbox" class="exercise-check" aria-label="런지 완료" disabled="" tabindex="-1" aria-disabled="true" value="on" style="color: rgb(40, 48, 66);"></label></div></div><aside class="fitness-right"><article><h3>이번 주 활동</h3><div class="activity-ring"><div><strong id="workout-days">3<span>/5</span></strong><small>운동한 날</small></div></div><div class="week-dots"><span>월<b>✓</b></span><span>화<b>✓</b></span><span>수<b>✓</b></span><span>목<b>·</b></span><span>금<b>·</b></span><span>토<b>·</b></span><span>일<b>·</b></span></div></article><article class="fitness-numbers"><div><small>이번 주 운동 시간</small><strong id="workout-minutes">125 <span>분</span></strong></div><div><small>예상 소모 칼로리</small><strong id="workout-kcal">840 <span>kcal</span></strong></div></article><article class="fitness-goal"><span>WEEKLY GOAL</span><h3>꾸준함이 실력이 됩니다.</h3><p>이번 주 목표까지 2일 남았어요.</p></article></aside></div></div></section></main></body></html>
